services:
  spec-auditor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spec-auditor
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model-pull:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - spec-net

  ollama:
    image: ollama/ollama:latest
    container_name: spec-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      # Agar host kompyuteringizda model avvaldan ~/.ollama da yuklangan bo'lsa:
      # - ${HOME}/.ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - spec-net

  ollama-model-pull:
    image: ollama/ollama:latest
    container_name: spec-ollama-model-pull
    environment:
      - OLLAMA_HOST=ollama:11434
      - MODEL_NAME=${OLLAMA_MODEL:-qwen2.5:7b}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "=================================================================="
        echo "[SpecAuditor Init] Checking AI model ($$MODEL_NAME)..."
        echo "=================================================================="
        if ! ollama list | grep -q "$$MODEL_NAME"; then
          echo "[SpecAuditor Init] Model $$MODEL_NAME topilmadi. Yuklanmoqda..."
          echo "[SpecAuditor Init] Birinchi marta ishga tushganda 4.7 GB yuklab olinadi..."
          ollama pull $$MODEL_NAME
          echo "[SpecAuditor Init] Model muvaffaqiyatli yuklab olindi!"
        else
          echo "[SpecAuditor Init] Model $$MODEL_NAME keshda mavjud va tayyor!"
        fi
        echo "=================================================================="
    restart: "no"
    networks:
      - spec-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: spec-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --url http://spec-auditor:8080
    depends_on:
      - spec-auditor
    networks:
      - spec-net
    profiles:
      - tunnel

volumes:
  ollama_data:

networks:
  spec-net:
    driver: bridge
